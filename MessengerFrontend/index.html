<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Secure Messenger</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 2rem auto;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 0.5rem;
            margin-bottom: 1rem;
        }

        .my {
            text-align: right;
            color: blue;
        }

        .other {
            text-align: left;
            color: green;
        }

        input, button {
            margin: 0.25rem;
        }
    </style>
</head>
<body>
    <h1>Secure Messenger</h1>
    <div><strong>Ваш Device ID:</strong> <span id="myDeviceId">(ещё нет)</span></div>
    <div><strong>Device ID собеседника:</strong> <input id="recipientId" placeholder="введите ID"></div>
    <button onclick="navigator.clipboard.writeText(myDeviceId)">Копировать мой ID</button>
    <div id="messages"></div>
    <input id="messageInput" placeholder="Сообщение" style="width: 70%">
    <button id="sendBtn">Отправить</button>


    <script src="app.js"></script>
</body>
</html>
